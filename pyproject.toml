[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finworld"
version = "0.1.0"
description = "Global financial institutions intelligence: registry, live fetchers, and logical/sentiment analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
finworld = "finworld.cli.main:main"

[tool.setuptools.packages.find]
include = ["finworld*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["finworld"]
check_untyped_defs = true

